name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix decompiled Java files with invalid ?? operator
        run: |
          echo "Fixing files with ?? operator (jadx decompile artifact)..."
          # Remove BOM from all Java files first
          find app/src/main/java -name "*.java" | xargs grep -rl $'\xef\xbb\xbf' 2>/dev/null | while read f; do
            sed -i '1s/^\xEF\xBB\xBF//' "$f"
          done
          # Replace ?? operator lines with comment
          find app/src/main/java -name "*.java" | xargs grep -rl '\?\?' 2>/dev/null | while read f; do
            sed -i 's/[[:space:]]*\?\? [a-zA-Z_][a-zA-Z0-9_]* = /Object /' "$f"
            sed -i 's/[[:space:]]*\?\? [a-zA-Z_][a-zA-Z0-9_]*;/\/\/ removed ?? artifact/' "$f"
          done
          echo "Fixed ?? operator issues"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvaMovies-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
