name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Exclude app files with broken imports
        run: python3 scripts/generate_excludes.py

      - name: Fix jadx UI package renames (pNNNui -> ui)
        run: python3 scripts/fix_ui_packages.py

      - name: Fix jadx decompiler artifacts in Java sources
        run: python3 scripts/fix_jadx_errors.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NuvaMovies-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
