plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nuvamovies.app'
    compileSdk 34

    buildToolsVersion "34.0.0"

    aaptOptions {
        noCompress 'tflite'
    }

    defaultConfig {
        applicationId "com.nuvamovies.app"
        minSdk 19
        targetSdk 33
        versionCode 49903
        versionName "4.99.3"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.1.0'
    
    // AndroidX Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.3.1'
    
    // AndroidX Fragment and ViewPager2
    implementation 'androidx.fragment:fragment:1.3.6'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    
    // AndroidX Media
    implementation 'androidx.media:media:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    
    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Networking - Retrofit2 + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // RxJava2
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    
    // Image Loading - Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    
    // EventBus
    implementation 'org.greenrobot:eventbus:3.3.1'
    
    // Leanback (TV UI)
    implementation 'androidx.leanback:leanback:1.0.0'
    
    // Video Player - ExoPlayer / IJKPlayer
    implementation 'com.google.android.exoplayer:exoplayer:2.18.1'
    
    // Firebase (optional - if needed)
    implementation platform('com.google.firebase:firebase-bom:31.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    
    // Material Dialogs
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    
    // Permissions
    implementation 'com.github.tbruyelle:RxPermissions:0.12'
    
    // Kotlin stdlib (for compatibility)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.21'
    
    // RecyclerView Adapter Helper
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    
    // AutoSize (screen adaptation)
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
    
    // Qiniu SDK
    implementation 'com.qiniu:qiniu-android-sdk:8.4.0'
    
    // Umeng Analytics
    implementation 'com.umeng.umsdk:common:9.4.4'
    implementation 'com.umeng.umsdk:asms:1.4.1'
    
    // SmartRefreshLayout
    implementation 'io.github.scwang90:refresh-layout-kernel:2.0.5'
    implementation 'io.github.scwang90:refresh-header-classics:2.0.5'
    
    // MMKV (key-value storage)
    implementation 'com.tencent:mmkv:1.2.13'
    
    // TheRouter (navigation)
    implementation 'cn.therouter:router:1.1.2'
}
