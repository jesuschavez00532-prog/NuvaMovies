plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nuvamovies.app'
    compileSdk 34

    buildToolsVersion "34.0.0"

    aaptOptions {
        noCompress 'tflite'
    }

    defaultConfig {
        applicationId "com.nuvamovies.app"
        minSdk 19
        targetSdk 33
        versionCode 49903
        versionName "4.99.3"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        debug {
            // Disable Crashlytics for debug builds - no build ID generated from decompiled source
            manifestPlaceholders = [crashlyticsCollectionEnabled: "false"]
            resValue "bool", "firebase_crashlytics_collection_enabled", "false"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

