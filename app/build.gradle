plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nuvamovies.app'
    compileSdk 34

    buildToolsVersion "34.0.0"

    aaptOptions {
        noCompress 'tflite'
    }

    defaultConfig {
        applicationId "com.nuvamovies.app"
        minSdk 19
        targetSdk 33
        versionCode 49903
        versionName "4.99.3"
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        debug {
            // Disable Crashlytics for debug builds - no build ID generated from decompiled source
            manifestPlaceholders = [crashlyticsCollectionEnabled: "false"]
            resValue "bool", "firebase_crashlytics_collection_enabled", "false"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java {
                // Exclude ONLY known 3rd party library packages
                // These are already compiled into AARs in dependencies
                exclude 'anet/**'
                exclude 'okhttp3/**'
                exclude 'okio/**'
                exclude 'antlr/**'
                exclude 'retrofit2/**'
                exclude 'javax/**'
                exclude 'androidx/**'
                exclude 'android/**'
                exclude 'io/**'
                exclude 'kotlinx/**'
                exclude 'org/**'
                // com/ 3rd party sub-packages only
                exclude 'com/alibaba/**'
                exclude 'com/bumptech/**'
                exclude 'com/bytedance/**'
                exclude 'com/efs/**'
                exclude 'com/google/**'
                exclude 'com/ixuea/**'
                exclude 'com/lzy/**'
                exclude 'com/open/**'
                exclude 'com/p077uc/**'
                exclude 'com/qiniu/**'
                exclude 'com/raizlabs/**'
                exclude 'com/swlauthnew/**'
                exclude 'com/taobao/**'
                exclude 'com/tbruyelle/**'
                exclude 'com/therouter/**'
                exclude 'com/titan/**'
                exclude 'com/titans/**'
                exclude 'com/trello/**'
                exclude 'com/umeng/**'
                exclude 'com/uyumao/**'
                exclude 'com/youth/**'
                exclude 'com/zhy/**'
                exclude 'me/jessyan/**'

                // Read dynamic excludes from file generated by generate_excludes.py
                // This avoids Groovy "Method too large" error from having thousands of exclude lines inline
                def excludesFile = file('excludes.txt')
                if (excludesFile.exists()) {
                    excludesFile.eachLine { line ->
                        if (line.trim() && !line.startsWith('#')) {
                            exclude line
                        }
                    }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.core:core-ktx:1.5.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.work:work-runtime:2.7.1'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // ExoPlayer
    implementation 'com.google.android.exoplayer:exoplayer:2.18.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.18.1'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.1'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.8.9'

    // EventBus
    implementation 'org.greenrobot:eventbus:3.3.1'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // ijkplayer - included as decompiled source, not as dependency
    // implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'

    // AndroidAutoSize
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'

    // MMKV
    implementation 'com.tencent:mmkv:1.2.13'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:30.3.1')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // umeng - common and asms only, umcrash included as decompiled source
    implementation 'com.umeng.umsdk:common:9.4.4'
    implementation 'com.umeng.umsdk:asms:1.4.1'
}
